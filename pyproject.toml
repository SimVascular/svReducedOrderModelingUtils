[build-system]
requires = [
  "setuptools>=45.0",
  "wheel>=0.36",
]
build-backend = "setuptools.build_meta"

[project]
name = "svromutils"
version = "0.1.1"
readme = "README.md"
license = "MIT"
dependencies = [
    "numpy>=2.5",
    "vtk>=9.2",
    "scipy>=1.18",
    "vmtk>=1.5.2",
]

[project.scripts]
svromutils-create-solver-file="svromutils.create_solver_file:run_cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]
